appId: com.lsimaocosta.calculadorapricesac
---
- runFlow: helpers/launch_dev_client.yaml
- tapOn:
    id: 'tab-premium'
- extendedWaitUntil:
    visible:
      id: 'screen-premium'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'btn-dev-prepare-free-rewarded'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn:
    id: 'btn-dev-prepare-free-rewarded'
- scrollUntilVisible:
    element:
      id: 'btn-dev-enable-app-open-stub'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn:
    id: 'btn-dev-enable-app-open-stub'
- killApp
- openLink:
    link: 'exp+calculadora-price-sac://expo-development-client/?url=http%3A%2F%2F10.0.2.2%3A8081&disableOnboarding=1'
- tapOn:
    text: 'Continue'
    optional: true
- tapOn:
    text: 'Go home'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'stub-ad-card-appOpen'
    timeout: 30000
- tapOn:
    id: 'stub-ad-close-button'
- extendedWaitUntil:
    visible:
      id: 'screen-calculator'
    timeout: 30000
