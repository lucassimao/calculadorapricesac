appId: com.lsimaocosta.calculadorapricesac
---
- runFlow: helpers/launch_dev_client.yaml
- tapOn:
    text: 'OK'
    optional: true
- evalScript: ${output.fgtsVisible = false}
- runFlow:
    when:
      visible:
        id: 'input-fgts-amount'
    commands:
      - evalScript: ${output.fgtsVisible = true}
- repeat:
    while:
      true: ${output.fgtsVisible == false}
    times: 12
    commands:
      - swipe:
          start: 50%, 88%
          end: 50%, 35%
      - runFlow:
          when:
            visible:
              id: 'input-fgts-amount'
          commands:
            - evalScript: ${output.fgtsVisible = true}
- tapOn:
    id: 'input-fgts-amount'
- eraseText
- inputText: '800'
- hideKeyboard
- tapOn:
    id: 'chip-fgts-usage-installment'
- tapOn:
    id: 'btn-add-fgts'
- evalScript: ${output.removeFgtsVisible = false}
- runFlow:
    when:
      visible:
        id: 'btn-remove-fgts'
    commands:
      - evalScript: ${output.removeFgtsVisible = true}
- repeat:
    while:
      true: ${output.removeFgtsVisible == false}
    times: 4
    commands:
      - swipe:
          start: 50%, 82%
          end: 50%, 45%
      - runFlow:
          when:
            visible:
              id: 'btn-remove-fgts'
          commands:
            - evalScript: ${output.removeFgtsVisible = true}
- tapOn:
    id: 'btn-remove-fgts'
