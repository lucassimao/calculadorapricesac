appId: com.lsimaocosta.calculadorapricesac
---
- killApp
- clearState
- openLink:
    link: 'exp+calculadora-price-sac://expo-development-client/?url=http%3A%2F%2F10.0.2.2%3A8081&disableOnboarding=1'
- tapOn:
    text: 'Continue'
    optional: true
- tapOn:
    text: 'Go home'
    optional: true
- extendedWaitUntil:
    visible: 'Price & SAC'
    timeout: 30000
- tapOn: 'Calculadora'
- scroll
- scroll
- scroll
- scroll
- scroll
- scroll
- scroll
- scroll
- tapOn: 'Valor do FGTS'
- eraseText
- inputText: '800'
- hideKeyboard
- tapOn: 'FGTS para parcela'
- scrollUntilVisible:
    element:
      text: 'Adicionar FGTS'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn: 'Adicionar FGTS'
- scrollUntilVisible:
    element:
      text: 'Remover FGTS'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- assertVisible: 'Remover FGTS'
- tapOn: 'Remover FGTS'
