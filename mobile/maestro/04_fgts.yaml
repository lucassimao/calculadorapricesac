appId: com.lsimaocosta.calculadorapricesac
---
- launchApp
- tapOn: 'Calculadora'
- scrollUntilVisible:
    element:
      text: 'FGTS'
    centerElement: true
    visibilityPercentage: 10
- tapOn: 'Data do FGTS'
- eraseText
- inputText: '2026-01-10'
- tapOn: 'Valor do FGTS'
- eraseText
- inputText: '800'
- tapOn: 'FGTS para parcela'
- pressKey: Back
- tapOn: 'Adicionar FGTS'
- assertVisible: 'Parcela'
- tapOn: 'Remover'
