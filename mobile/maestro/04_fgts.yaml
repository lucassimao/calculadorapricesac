appId: com.lsimaocosta.calculadorapricesac
---
- runFlow: helpers/launch_dev_client.yaml
- tapOn:
    id: 'tab-premium'
- extendedWaitUntil:
    visible:
      id: 'screen-premium'
    timeout: 5000
- scrollUntilVisible:
    element:
      id: 'btn-dev-prepare-premium'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn:
    id: 'btn-dev-prepare-premium'
- tapOn:
    id: 'tab-calculator'
- assertVisible:
    id: 'screen-calculator'
- tapOn:
    text: 'OK'
    optional: true
- evalScript: ${output.fgtsVisible = false}
- runFlow:
    when:
      visible:
        id: 'input-fgts-amount'
    commands:
      - evalScript: ${output.fgtsVisible = true}
- repeat:
    while:
      true: ${output.fgtsVisible == false}
    times: 12
    commands:
      - swipe:
          start: 50%, 88%
          end: 50%, 35%
      - runFlow:
          when:
            visible:
              id: 'input-fgts-amount'
          commands:
            - evalScript: ${output.fgtsVisible = true}
- tapOn:
    id: 'input-fgts-amount'
- eraseText
- inputText: '800'
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: 'chip-fgts-usage-installment'
    timeout: 5000
- tapOn:
    id: 'chip-fgts-usage-installment'
- scrollUntilVisible:
    element:
      id: 'btn-add-fgts'
    timeout: 8000
    speed: 60
    visibilityPercentage: 10
- tapOn:
    id: 'btn-add-fgts'
- evalScript: ${output.removeFgtsVisible = false}
- runFlow:
    when:
      visible:
        id: 'btn-remove-fgts'
    commands:
      - evalScript: ${output.removeFgtsVisible = true}
- repeat:
    while:
      true: ${output.removeFgtsVisible == false}
    times: 12
    commands:
      - swipe:
          start: 50%, 82%
          end: 50%, 45%
      - runFlow:
          when:
            visible:
              id: 'btn-remove-fgts'
          commands:
            - evalScript: ${output.removeFgtsVisible = true}
- tapOn:
    id: 'btn-remove-fgts'
