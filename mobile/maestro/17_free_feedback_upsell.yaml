appId: com.lsimaocosta.calculadorapricesac
---
- runFlow: helpers/launch_dev_client.yaml
- evalScript: ${output.premiumReady = false}
- repeat:
    while:
      true: ${output.premiumReady == false}
    times: 4
    commands:
      - tapOn:
          id: 'tab-premium'
      - runFlow:
          when:
            visible:
              id: 'screen-premium'
          commands:
            - evalScript: ${output.premiumReady = true}
- assertVisible:
    id: 'screen-premium'
- scrollUntilVisible:
    element:
      id: 'btn-dev-prepare-free-rewarded'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn:
    id: 'btn-dev-prepare-free-rewarded'
- evalScript: ${output.feedbackReady = false}
- repeat:
    while:
      true: ${output.feedbackReady == false}
    times: 4
    commands:
      - tapOn:
          id: 'tab-feedback'
      - runFlow:
          when:
            visible:
              id: 'screen-feedback'
          commands:
            - evalScript: ${output.feedbackReady = true}
- assertVisible:
    id: 'screen-feedback'
- assertVisible:
    id: 'feedback-email-card'
- assertVisible:
    id: 'feedback-email-open-button'
- assertVisible:
    id: 'feedback-whatsapp-upsell-card'
- assertVisible:
    id: 'feedback-whatsapp-upsell-text'
- assertNotVisible:
    id: 'feedback-whatsapp-button'
