appId: com.lsimaocosta.calculadorapricesac
---
- runFlow: helpers/launch_dev_client.yaml
- tapOn:
    id: 'tab-premium'
- extendedWaitUntil:
    visible: 'Plano Premium'
    timeout: 5000
- scrollUntilVisible:
    element:
      text: 'Preparar exportação grátis (dev)'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn: 'Preparar exportação grátis (dev)'
- tapOn:
    id: 'tab-feedback'
- assertVisible: 'Feedback'
- assertVisible: 'E-mail'
- assertVisible: 'Abrir e-mail'
- assertVisible: 'WhatsApp'
- assertVisible: 'Assine o Premium para atendimento prioritário via WhatsApp.'
- assertNotVisible: 'Conversar no WhatsApp'
