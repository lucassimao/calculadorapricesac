appId: com.lsimaocosta.calculadorapricesac
---
- runFlow: helpers/launch_dev_client_any_screen.yaml
- tapOn:
    id: 'tab-premium'
- extendedWaitUntil:
    visible:
      id: 'screen-premium'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'btn-dev-prepare-free-rewarded'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn:
    id: 'btn-dev-prepare-free-rewarded'
- tapOn:
    id: 'tab-calculator'
- runFlow: helpers/seed_export_extras_dev.yaml
- extendedWaitUntil:
    visible:
      id: 'tab-export'
    timeout: 10000
- tapOn:
    id: 'tab-export'
- assertVisible:
    id: 'android-export-modal-card'
- tapOn:
    id: 'android-export-modal-pdf'
- assertVisible:
    id: 'stub-ad-card-rewarded'
- tapOn:
    id: 'stub-ad-rewarded-cancel'
- assertNotVisible:
    id: 'stub-ad-card-rewarded'
