appId: com.lsimaocosta.calculadorapricesac
---
- runFlow: helpers/launch_dev_client.yaml
- tapOn:
    id: 'tab-calculator'
- scrollUntilVisible:
    element:
      id: 'input-rate'
    centerElement: true
    timeout: 12000
    speed: 45
    visibilityPercentage: 10
- tapOn:
    id: 'input-rate'
- eraseText
- inputText: '1'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'input-term'
    centerElement: true
    timeout: 12000
    speed: 45
    visibilityPercentage: 10
- tapOn:
    id: 'input-term'
- eraseText
- inputText: '12'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'chip-index-tr'
    centerElement: true
    timeout: 12000
    speed: 45
    visibilityPercentage: 10
- tapOn:
    id: 'chip-index-tr'
- assertVisible:
    id: 'input-index-rate'
- tapOn:
    id: 'chip-index-ipca'
- assertVisible:
    id: 'input-index-rate'
- tapOn:
    id: 'input-index-rate'
- eraseText
- inputText: '0,5'
- hideKeyboard
- assertVisible: '0,5'
- scrollUntilVisible:
    element:
      id: 'summary-index-type-ipca'
    centerElement: false
    timeout: 30000
    speed: 60
    visibilityPercentage: 10
- assertVisible:
    id: 'summary-index-type-ipca'
- assertVisible:
    id: 'summary-total-index-correction'
- assertVisible: '0,50000% a.m.'
- scrollUntilVisible:
    element:
      id: 'table-meta-row-12'
    centerElement: false
    timeout: 30000
    speed: 70
    visibilityPercentage: 10
- assertVisible:
    id: 'table-meta-row-12'
