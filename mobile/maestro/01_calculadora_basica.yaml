appId: com.lsimaocosta.calculadorapricesac
---
- launchApp
- tapOn: "Calculadora"
- assertVisible: "Calculadora Price & SAC"
- scrollUntilVisible:
    element:
      text: "Parâmetros"
    centerElement: true
    visibilityPercentage: 10
- scrollUntilVisible:
    element:
      text: "Valor do financiamento"
    centerElement: true
    visibilityPercentage: 10
- tapOn: "Valor do financiamento"
- eraseText
- inputText: "250000"
- scrollUntilVisible:
    element:
      text: "Taxa de juros"
    centerElement: true
    visibilityPercentage: 10
- tapOn: "Taxa de juros"
- eraseText
- inputText: "1,1"
- scrollUntilVisible:
    element:
      text: "Prazo"
    centerElement: true
    visibilityPercentage: 10
- tapOn: "Prazo"
- eraseText
- inputText: "240"
- scrollUntilVisible:
    element:
      text: "Dia de vencimento"
    centerElement: true
    visibilityPercentage: 10
- tapOn: "Dia de vencimento"
- eraseText
- inputText: "10"
- scrollUntilVisible:
    element:
      text: "Resumo"
    centerElement: true
    visibilityPercentage: 10
- assertVisible: "Total Pago"
- assertVisible: "Total de Juros"
