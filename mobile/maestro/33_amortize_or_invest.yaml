appId: com.lsimaocosta.calculadorapricesac
---
- runFlow: helpers/launch_dev_client.yaml
- tapOn:
    id: tab-premium
- scrollUntilVisible:
    element:
      id: btn-dev-prepare-free-rewarded
    direction: DOWN
    timeout: 12000
    speed: 70
    visibilityPercentage: 10
- tapOn:
    id: btn-dev-prepare-free-rewarded
- tapOn:
    id: tab-calculator
- evalScript: ${output.investmentVisible = false}
- runFlow:
    when:
      visible:
        id: section-amortize-invest
    commands:
      - evalScript: ${output.investmentVisible = true}
- repeat:
    while:
      true: ${output.investmentVisible == false}
    times: 24
    commands:
      - swipe:
          start: 50%, 88%
          end: 50%, 30%
      - runFlow:
          when:
            visible:
              id: section-amortize-invest
          commands:
            - evalScript: ${output.investmentVisible = true}
- assertVisible:
    id: section-amortize-invest
- scrollUntilVisible:
    element:
      id: amortize-invest-premium-gate
    direction: DOWN
    timeout: 8000
    visibilityPercentage: 10
- assertVisible:
    id: amortize-invest-premium-gate
- scrollUntilVisible:
    element:
      id: btn-amortize-invest-upgrade
    direction: DOWN
    timeout: 8000
    visibilityPercentage: 30
- tapOn:
    id: btn-amortize-invest-upgrade
- assertVisible:
    id: screen-premium
- runFlow: helpers/enable_premium_dev.yaml
- tapOn:
    id: tab-calculator
- evalScript: ${output.investmentVisible = false}
- repeat:
    while:
      true: ${output.investmentVisible == false}
    times: 24
    commands:
      - swipe:
          start: 50%, 88%
          end: 50%, 30%
      - runFlow:
          when:
            visible:
              id: input-amortize-invest-amount
          commands:
            - evalScript: ${output.investmentVisible = true}
- tapOn:
    id: input-amortize-invest-amount
- inputText: '20000'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: input-investment-annual-rate
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 30
- tapOn:
    id: input-investment-annual-rate
- eraseText
- inputText: '5'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: btn-compare-amortize-invest
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 30
- tapOn:
    id: btn-compare-amortize-invest
- scrollUntilVisible:
    element:
      id: amortize-invest-result
    direction: DOWN
    timeout: 12000
    visibilityPercentage: 20
- assertVisible:
    id: amortize-invest-result
- assertVisible: 'Amortizar vence.*'
- assertVisible: 'Juros economizados'
- scrollUntilVisible:
    element:
      text: 'Taxa de virada:.*'
    direction: DOWN
    timeout: 8000
    visibilityPercentage: 20
- assertVisible: 'Taxa de virada:.*'
- tapOn:
    id: tab-premium
- scrollUntilVisible:
    element:
      id: btn-dev-seed-investment-rate-change
    direction: DOWN
    timeout: 30000
    speed: 70
    visibilityPercentage: 10
- tapOn:
    id: btn-dev-seed-investment-rate-change
- runFlow: helpers/launch_dev_client.yaml
- assertVisible:
    id: investment-rate-change-banner
- assertVisible: 'A taxa mudou — vale mais amortizar ou investir agora?'
- tapOn:
    id: btn-open-amortize-invest
- extendedWaitUntil:
    visible:
      id: input-amortize-invest-amount
    timeout: 5000
