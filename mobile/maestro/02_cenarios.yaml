appId: com.lsimaocosta.calculadorapricesac
---
- runFlow: helpers/launch_dev_client.yaml
- tapOn:
    id: 'tab-premium'
- scrollUntilVisible:
    element:
      id: 'btn-dev-prepare-premium'
    timeout: 20000
    speed: 50
    visibilityPercentage: 10
    waitToSettleTimeoutMs: 1000
- tapOn:
    id: 'btn-dev-prepare-premium'
- scrollUntilVisible:
    element:
      id: 'btn-dev-disable-premium'
    direction: UP
    timeout: 8000
    speed: 60
    visibilityPercentage: 10
- assertVisible:
    id: 'btn-dev-disable-premium'
- tapOn:
    id: 'tab-calculator'
- scrollUntilVisible:
    element:
      id: 'input-scenario-name'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn:
    id: 'input-scenario-name'
- eraseText
- inputText: 'Cenario Teste'
- pressKey: Back
- tapOn:
    id: 'btn-save-scenario'
- scrollUntilVisible:
    element:
      id: 'scenario-item-0'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn:
    id: 'btn-new-scenario'
- scrollUntilVisible:
    element:
      id: 'scenario-item-0'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn:
    id: 'scenario-item-0'
- assertVisible:
    id: 'input-scenario-name'
