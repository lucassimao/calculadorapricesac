appId: com.lsimaocosta.calculadorapricesac
---
- runFlow: helpers/launch_dev_client.yaml
- tapOn: 'Aba Premium'
- assertVisible:
    id: 'screen-premium-title'
- tapOn: 'Ativar premium (dev)'
- assertVisible: 'Desativar premium (dev)'
- tapOn: 'Aba Calculadora'
- scrollUntilVisible:
    element:
      text: 'Nome do cenário'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn: 'Nome do cenário'
- eraseText
- inputText: 'Cenario Teste'
- pressKey: Back
- tapOn: 'Salvar cenário'
- scrollUntilVisible:
    element:
      text: 'Cenario Teste'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn: 'Novo'
- scrollUntilVisible:
    element:
      text: 'Cenario Teste'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn: 'Cenario Teste'
- assertVisible: 'Cenario Teste'
