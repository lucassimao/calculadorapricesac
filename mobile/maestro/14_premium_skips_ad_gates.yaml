appId: com.lsimaocosta.calculadorapricesac
---
- runFlow: helpers/launch_dev_client_any_screen.yaml
- tapOn:
    id: 'tab-premium'
- extendedWaitUntil:
    visible:
      id: 'screen-premium'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'btn-dev-prepare-free-rewarded'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn:
    id: 'btn-dev-prepare-free-rewarded'
- scrollUntilVisible:
    element:
      id: 'btn-dev-enable-all-ad-stubs'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn:
    id: 'btn-dev-enable-all-ad-stubs'
- scrollUntilVisible:
    element:
      id: 'btn-dev-enable-premium'
    direction: UP
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn:
    id: 'btn-dev-enable-premium'
- scrollUntilVisible:
    element:
      id: 'premium-status-card'
    direction: UP
    timeout: 12000
    speed: 80
    visibilityPercentage: 10
- tapOn:
    id: 'tab-calculator'
- scrollUntilVisible:
    element:
      id: 'input-scenario-name'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- scrollUntilVisible:
    element:
      id: 'btn-save-scenario'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn:
    id: 'btn-save-scenario'
- assertNotVisible:
    id: 'stub-ad-card-interstitial'
- killApp
- openLink:
    link: 'exp+calculadora-price-sac://expo-development-client/?url=http%3A%2F%2F10.0.2.2%3A8081&disableOnboarding=1'
- tapOn:
    text: 'Continue'
    optional: true
- tapOn:
    text: 'Go home'
    optional: true
- tapOn:
    id: 'stub-ad-close-button'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'screen-calculator'
    timeout: 30000
- tapOn:
    id: 'stub-ad-close-button'
    optional: true
- assertNotVisible:
    id: 'stub-ad-card-appOpen'
