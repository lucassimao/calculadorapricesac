appId: com.lsimaocosta.calculadorapricesac
---
- runFlow: helpers/launch_dev_client.yaml
- tapOn:
    id: 'tab-premium'
- extendedWaitUntil:
    visible: 'Plano Premium'
    timeout: 5000
- scrollUntilVisible:
    element:
      text: 'Preparar exportação grátis (dev)'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn: 'Preparar exportação grátis (dev)'
- scrollUntilVisible:
    element:
      text: 'Ativar app open stub (dev)'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- scrollUntilVisible:
    element:
      text: 'Ativar interstitial stub (dev)'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn: 'Ativar interstitial stub (dev)'
- tapOn: 'Ativar app open stub (dev)'
- scrollUntilVisible:
    element:
      text: 'Ativar premium (dev)'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn: 'Ativar premium (dev)'
- tapOn:
    id: 'tab-calculator'
- tapOn: 'Salvar cenário'
- assertNotVisible: 'Interstitial de Teste'
- killApp
- openLink:
    link: 'exp+calculadora-price-sac://expo-development-client/?url=http%3A%2F%2F10.0.2.2%3A8081&disableOnboarding=1'
- tapOn:
    text: 'Continue'
    optional: true
- tapOn:
    text: 'Go home'
    optional: true
- tapOn:
    text: 'Fechar anúncio'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'screen-calculator'
    timeout: 30000
- tapOn:
    text: 'Fechar anúncio'
    optional: true
- assertNotVisible: 'App Open de Teste'
