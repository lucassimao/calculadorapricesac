appId: com.lsimaocosta.calculadorapricesac
---
- runFlow: helpers/launch_dev_client.yaml
- tapOn:
    id: 'tab-premium'
- scrollUntilVisible:
    element:
      text: 'Ativar ads stub (dev)'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn: 'Desativar premium (dev)'
- tapOn: 'Ativar ads stub (dev)'
- assertVisible: 'Stub: ativo | Interstitial: inativo | App open: inativo'
- tapOn:
    id: 'tab-calculator'
- tapOn:
    id: 'tab-export'
- assertVisible: 'Exportar Simulação'
- tapOn: 'Exportar PDF'
- extendedWaitUntil:
    visible: 'Anúncio Rewarded de Teste'
    timeout: 10000
