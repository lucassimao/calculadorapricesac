appId: com.lsimaocosta.calculadorapricesac
---
- killApp
- clearState
- openLink:
    link: 'exp+calculadora-price-sac://expo-development-client/?url=http%3A%2F%2F10.0.2.2%3A8081&disableOnboarding=1'
- tapOn:
    text: 'Continue'
    optional: true
- tapOn:
    text: 'Go home'
    optional: true
- extendedWaitUntil:
    visible: 'Price & SAC'
    timeout: 30000
- tapOn: 'Premium'
- tapOn: 'Desativar premium (dev)'
- tapOn: 'Exportar'
- assertVisible: 'Exportar Simulação'
- tapOn: 'PDF'
- assertVisible: 'Exportação disponível apenas para assinantes.'
