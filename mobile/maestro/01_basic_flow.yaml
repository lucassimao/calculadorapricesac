appId: com.lsimaocosta.calculadorapricesac
---
- runFlow: helpers/launch_dev_client.yaml
- tapOn:
    id: 'tab-calculator'
- scrollUntilVisible:
    element:
      text: 'Parâmetros'
    centerElement: true
    visibilityPercentage: 10
- scrollUntilVisible:
    element:
      text: 'Valor do financiamento'
    centerElement: true
    visibilityPercentage: 10
- tapOn: 'Valor do financiamento'
- eraseText
- inputText: '250000'
- hideKeyboard
- scrollUntilVisible:
    element:
      text: 'Taxa de juros'
    centerElement: true
    visibilityPercentage: 10
- tapOn: 'Taxa de juros'
- eraseText
- inputText: '1,1'
- hideKeyboard
- scrollUntilVisible:
    element:
      text: 'Prazo'
    centerElement: true
    visibilityPercentage: 10
- tapOn: 'Prazo'
- eraseText
- inputText: '240'
- hideKeyboard
- scrollUntilVisible:
    element:
      text: 'Dia de vencimento'
    centerElement: true
    visibilityPercentage: 10
- tapOn: 'Dia de vencimento'
- eraseText
- inputText: '10'
- hideKeyboard
- scrollUntilVisible:
    element:
      text: 'Resumo'
    centerElement: true
    visibilityPercentage: 10
- assertVisible: 'Resumo'
- scrollUntilVisible:
    element:
      text: 'Total Pago'
    centerElement: true
    visibilityPercentage: 10
- assertVisible: 'Total Pago'
- scrollUntilVisible:
    element:
      text: 'Composição das Parcelas'
    centerElement: true
    visibilityPercentage: 10
- assertVisible: 'Composição das Parcelas'
- tapOn:
    id: 'tab-comparison'
- assertVisible: 'Comparar SAC vs Price'
