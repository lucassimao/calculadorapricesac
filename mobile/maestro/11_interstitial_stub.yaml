appId: com.lsimaocosta.calculadorapricesac
---
- runFlow: helpers/launch_dev_client.yaml
- evalScript: ${output.premiumReady = false}
- repeat:
    while:
      true: ${output.premiumReady == false}
    times: 3
    commands:
      - tapOn:
          id: 'tab-premium'
      - extendedWaitUntil:
          visible:
            id: 'screen-premium'
          timeout: 5000
          optional: true
      - runFlow:
          when:
            visible:
              id: 'screen-premium'
          commands:
            - evalScript: ${output.premiumReady = true}
- assertVisible:
    id: 'screen-premium'
- scrollUntilVisible:
    element:
      id: 'btn-dev-prepare-free-rewarded'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn:
    id: 'btn-dev-prepare-free-rewarded'
- scrollUntilVisible:
    element:
      id: 'btn-dev-enable-interstitial-stub'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn:
    id: 'btn-dev-enable-interstitial-stub'
- scrollUntilVisible:
    element:
      id: 'btn-dev-reset-scenarios'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn:
    id: 'btn-dev-reset-scenarios'
- killApp
- runFlow: helpers/launch_dev_client.yaml
- scrollUntilVisible:
    element:
      id: 'input-scenario-name'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn:
    id: 'input-scenario-name'
- eraseText
- inputText: 'Cenario Interstitial'
- tapOn:
    id: 'section-scenarios'
    optional: true
- scrollUntilVisible:
    element:
      id: 'btn-save-scenario'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn:
    id: 'btn-save-scenario'
- assertVisible:
    id: 'stub-ad-card-interstitial'
- tapOn:
    id: 'stub-ad-close-button'
- tapOn:
    id: 'input-scenario-name'
- eraseText
- inputText: 'Cenario Interstitial Atualizado'
- tapOn:
    id: 'section-scenarios'
    optional: true
- scrollUntilVisible:
    element:
      id: 'btn-save-scenario'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn:
    id: 'btn-save-scenario'
- assertNotVisible:
    id: 'stub-ad-card-interstitial'
