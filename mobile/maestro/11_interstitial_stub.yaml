appId: com.lsimaocosta.calculadorapricesac
---
- runFlow: helpers/launch_dev_client.yaml
- tapOn:
    id: 'tab-premium'
- extendedWaitUntil:
    visible: 'Plano Premium'
    timeout: 5000
- scrollUntilVisible:
    element:
      text: 'Preparar exportação grátis (dev)'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn: 'Preparar exportação grátis (dev)'
- scrollUntilVisible:
    element:
      text: 'Ativar interstitial stub (dev)'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn: 'Ativar interstitial stub (dev)'
- tapOn:
    id: 'tab-calculator'
- tapOn: 'Salvar cenário'
- assertVisible: 'Interstitial de Teste'
- tapOn: 'Fechar anúncio'
- tapOn: 'Salvar cenário'
- assertNotVisible: 'Interstitial de Teste'
