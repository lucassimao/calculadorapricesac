appId: com.lsimaocosta.calculadorapricesac
---
- launchApp
- tapOn: 'Comparar'
- assertVisible: 'Comparar SAC vs Price'
- scrollUntilVisible:
    element:
      text: 'Comparador Rápido'
    centerElement: true
    visibilityPercentage: 10
- tapOn: 'Juros condição Condição A'
- eraseText
- inputText: '1,3'
- tapOn: 'Prazo condição Condição B'
- eraseText
- inputText: '180'
- tapOn: 'Entrada condição Condição C'
- eraseText
- inputText: '50000'
- assertVisible: 'Total c/ Custos'
