appId: com.lsimaocosta.calculadorapricesac
---
- runFlow: helpers/launch_dev_client.yaml
- tapOn:
    id: 'tab-comparison'
- assertVisible: 'Comparar SAC vs Price'
- scrollUntilVisible:
    element:
      text: 'Condição A'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- assertVisible: 'Condição A'
- scrollUntilVisible:
    element:
      text: 'Condição C'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- assertVisible: 'Condição C'
