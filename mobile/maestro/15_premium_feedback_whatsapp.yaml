appId: com.lsimaocosta.calculadorapricesac
---
- runFlow: helpers/launch_dev_client.yaml
- tapOn:
    id: 'tab-premium'
- extendedWaitUntil:
    visible:
      id: 'screen-premium'
    timeout: 5000
- scrollUntilVisible:
    element:
      id: 'btn-dev-prepare-free-rewarded'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn:
    id: 'btn-dev-prepare-free-rewarded'
- assertVisible:
    id: 'ad-banner-stub'
- scrollUntilVisible:
    element:
      id: 'btn-dev-enable-premium'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn:
    id: 'btn-dev-enable-premium'
- tapOn:
    id: 'tab-feedback'
- assertVisible:
    id: 'screen-feedback'
- assertNotVisible:
    id: 'ad-banner-stub'
- assertVisible:
    id: 'feedback-whatsapp-card'
- assertVisible:
    id: 'feedback-whatsapp-button'
- assertNotVisible:
    id: 'feedback-whatsapp-upsell-card'
