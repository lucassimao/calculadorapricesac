appId: com.lsimaocosta.calculadorapricesac
---
- runFlow: helpers/launch_dev_client.yaml
- tapOn:
    id: 'tab-premium'
- extendedWaitUntil:
    visible: 'Plano Premium'
    timeout: 5000
- scrollUntilVisible:
    element:
      text: 'Preparar exportação grátis (dev)'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn: 'Preparar exportação grátis (dev)'
- tapOn:
    id: 'tab-calculator'
- runFlow: helpers/seed_export_extras_dev.yaml
- tapOn:
    id: 'tab-export'
- assertVisible: 'Exportar Simulação'
- tapOn: 'Exportar PDF'
- assertVisible: 'Anúncio Rewarded de Teste'
- tapOn: 'Falhar anúncio'
- assertVisible: 'Anúncio indisponível'
- assertVisible: 'Não foi possível carregar o anúncio agora. Tente novamente em instantes ou assine o Premium.'
