appId: com.lsimaocosta.calculadorapricesac
---
- runFlow: ../helpers/launch_dev_client.yaml
- repeat:
    times: 8
    commands:
      - swipe:
          start: 50%, 30%
          end: 50%, 85%
- scrollUntilVisible:
    element:
      id: entry-mode-existing-contract
    direction: DOWN
    timeout: 12000
- tapOn:
    id: entry-mode-existing-contract
- tapOn: 'Trocar e limpar'
- scrollUntilVisible:
    element:
      id: input-principal
    direction: DOWN
    timeout: 8000
- tapOn:
    id: input-principal
- eraseText
- inputText: '200000'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: input-term
    direction: DOWN
    timeout: 8000
- tapOn:
    id: input-term
- eraseText
- inputText: '180'
- hideKeyboard
- evalScript: ${output.prepaymentVisible = false}
- runFlow:
    when:
      visible:
        id: input-prepayment-amount
    commands:
      - evalScript: ${output.prepaymentVisible = true}
- repeat:
    while:
      true: ${output.prepaymentVisible == false}
    times: 20
    commands:
      - swipe:
          start: 50%, 88%
          end: 50%, 35%
      - runFlow:
          when:
            visible:
              id: input-prepayment-amount
          commands:
            - evalScript: ${output.prepaymentVisible = true}
- assertVisible:
    id: input-prepayment-amount
- tapOn:
    id: input-prepayment-amount
- eraseText
- inputText: '200000'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: btn-add-prepayment
    direction: DOWN
    timeout: 10000
- takeScreenshot: ../marketing/public/recursos/_captures/payoff-entry
- tapOn:
    id: btn-add-prepayment
- scrollUntilVisible:
    element:
      id: existing-contract-prepayment-impact
    direction: UP
    timeout: 12000
    visibilityPercentage: 20
- assertVisible:
    id: existing-contract-prepayment-impact
- takeScreenshot: ../marketing/public/recursos/_captures/payoff
