appId: com.lsimaocosta.calculadorapricesac
---
- runFlow: ../helpers/launch_dev_client.yaml
- scrollUntilVisible:
    element:
      id: system-price
    direction: DOWN
    timeout: 12000
- tapOn:
    id: system-price
- tapOn:
    id: loan-mode-standard
- scrollUntilVisible:
    element:
      id: input-principal
    centerElement: true
    timeout: 12000
    speed: 45
    visibilityPercentage: 10
- tapOn:
    id: input-principal
- eraseText
- inputText: '80000'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: input-rate
    centerElement: true
    timeout: 12000
    speed: 45
    visibilityPercentage: 10
- tapOn:
    id: input-rate
- eraseText
- inputText: '1,2'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: input-term
    centerElement: true
    timeout: 12000
    speed: 45
    visibilityPercentage: 10
- tapOn:
    id: input-term
- eraseText
- inputText: '48'
- hideKeyboard
- takeScreenshot: ../marketing/public/recursos/_captures/vehicle-parameters
- scrollUntilVisible:
    element:
      id: summary-first-payment-value
    direction: DOWN
    centerElement: true
    timeout: 30000
    speed: 50
    visibilityPercentage: 30
    waitToSettleTimeoutMs: 1000
- assertVisible:
    id: summary-first-payment-value
- takeScreenshot: ../marketing/public/recursos/_captures/vehicle-summary
