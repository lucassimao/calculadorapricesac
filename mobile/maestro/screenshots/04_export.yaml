appId: com.lsimaocosta.calculadorapricesac
---
- runFlow: ../helpers/launch_dev_client.yaml
- runFlow: ../helpers/enable_premium_dev.yaml
- tapOn:
    id: tab-calculator
- runFlow: ../helpers/seed_export_extras_dev.yaml
- tapOn:
    id: tab-export
- assertVisible:
    id: android-export-modal-card
- takeScreenshot: ../marketing/public/recursos/_captures/export
- tapOn:
    id: android-export-modal-pdf-professional
- assertVisible: 'Complete o perfil profissional'
- assertVisible: 'COMPLETAR PERFIL'
- takeScreenshot: ../marketing/public/recursos/_captures/export-professional
