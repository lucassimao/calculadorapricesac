appId: com.lsimaocosta.calculadorapricesac
---
- runFlow: ../helpers/launch_dev_client.yaml
- tapOn:
    id: tab-calculator
- evalScript: ${output.prepaymentVisible = false}
- runFlow:
    when:
      visible:
        id: input-prepayment-amount
    commands:
      - evalScript: ${output.prepaymentVisible = true}
- repeat:
    while:
      true: ${output.prepaymentVisible == false}
    times: 12
    commands:
      - swipe:
          start: 50%, 88%
          end: 50%, 35%
      - runFlow:
          when:
            visible:
              id: input-prepayment-amount
          commands:
            - evalScript: ${output.prepaymentVisible = true}
- assertVisible:
    id: input-prepayment-amount
- tapOn:
    id: input-prepayment-amount
- eraseText
- inputText: '10000'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: btn-add-prepayment
    timeout: 12000
    speed: 60
    visibilityPercentage: 10
- tapOn:
    id: btn-add-prepayment
- takeScreenshot: ../marketing/public/recursos/_captures/prepayment
- scrollUntilVisible:
    element:
      id: section-summary
    direction: UP
    centerElement: false
    timeout: 30000
    speed: 60
    visibilityPercentage: 10
- assertVisible:
    id: summary-first-payment-value
- takeScreenshot: ../marketing/public/recursos/_captures/prepayment-summary
