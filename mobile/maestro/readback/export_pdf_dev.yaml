appId: com.lsimaocosta.calculadorapricesac
---
- runFlow: ../helpers/launch_dev_client.yaml
- tapOn: 'Aba Premium'
- assertVisible:
    id: 'screen-premium-title'
- tapOn:
    text: 'Ativar premium (dev)'
    optional: true
- assertVisible: 'Desativar premium (dev)'
- tapOn: 'Aba Calculadora'
- runFlow: ../helpers/seed_export_extras_dev.yaml
- extendedWaitUntil:
    visible:
      id: 'label-seed-export-extras-dev'
    timeout: 5000
- tapOn: 'Aba Exportar'
- assertVisible: 'Exportar Simulação'
- tapOn: 'PDF'
- extendedWaitUntil:
    notVisible: 'Exportar Simulação'
    timeout: 10000
