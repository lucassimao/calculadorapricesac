appId: com.lsimaocosta.calculadorapricesac
---
- runFlow: ../helpers/launch_dev_client.yaml
- tapOn:
    id: 'tab-premium'
- scrollUntilVisible:
    element:
      id: 'btn-dev-prepare-premium'
    timeout: 12000
    speed: 60
    visibilityPercentage: 10
- tapOn:
    id: 'btn-dev-prepare-premium'
- assertVisible:
    id: 'btn-dev-disable-premium'
- tapOn:
    id: 'tab-calculator'
- runFlow: ../helpers/seed_export_extras_dev.yaml
- extendedWaitUntil:
    visible:
      id: 'label-seed-export-extras-dev'
    timeout: 5000
- tapOn:
    id: 'tab-export'
- assertVisible:
    id: 'android-export-modal-card'
- tapOn:
    id: 'android-export-modal-csv'
- extendedWaitUntil:
    notVisible:
      id: 'android-export-modal-card'
    timeout: 10000
