appId: com.lsimaocosta.calculadorapricesac
---
- killApp
- clearState
- openLink:
    link: 'exp+calculadora-price-sac://expo-development-client/?url=http%3A%2F%2F10.0.2.2%3A8081&disableOnboarding=1'
- tapOn:
    text: 'Continue'
    optional: true
- tapOn:
    text: 'Go home'
    optional: true
- extendedWaitUntil:
    visible: 'Price & SAC'
    timeout: 30000
- tapOn: 'Premium'
- assertVisible: 'Plano Premium'
- tapOn: 'Ativar premium (dev)'
- tapOn: 'Calculadora'
- scrollUntilVisible:
    element:
      text: 'Popular extras (dev)'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn: 'Popular extras (dev)'
- assertVisible: 'Extras prontos (dev)'
- tapOn: 'Exportar'
- assertVisible: 'Exportar Simulação'
- tapOn: 'CSV'
