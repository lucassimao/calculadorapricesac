appId: com.lsimaocosta.calculadorapricesac
---
- runFlow: ../helpers/launch_dev_client.yaml
- runFlow: ../helpers/enable_premium_dev.yaml
- assertVisible:
    id: premium-status-title
    text: Premium ativo
- tapOn:
    id: 'tab-calculator'
- runFlow: ../helpers/seed_export_extras_dev.yaml
- extendedWaitUntil:
    visible:
      id: 'label-seed-export-extras-dev'
    timeout: 5000
- tapOn:
    id: 'tab-export'
- assertVisible:
    id: 'android-export-modal-card'
- tapOn:
    id: 'android-export-modal-xlsx'
- extendedWaitUntil:
    notVisible:
      id: 'android-export-modal-card'
    timeout: 10000
