appId: com.lsimaocosta.calculadorapricesac
---
- runFlow: ../helpers/launch_dev_client.yaml
- tapOn:
    id: 'tab-premium'
- scrollUntilVisible:
    element:
      text: 'Preparar exportação grátis (dev)'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn: 'Preparar exportação grátis (dev)'
- tapOn:
    id: 'tab-calculator'
- runFlow: ../helpers/seed_export_extras_dev.yaml
- extendedWaitUntil:
    visible:
      id: 'label-seed-export-extras-dev'
    timeout: 5000
- tapOn:
    id: 'tab-export'
- assertVisible: 'Exportar Simulação'
- tapOn: 'Exportar XLSX'
- assertVisible: 'Anúncio Rewarded de Teste'
- tapOn: 'Concluir anúncio'
- extendedWaitUntil:
    notVisible: 'Anúncio Rewarded de Teste'
    timeout: 10000
- extendedWaitUntil:
    notVisible: 'Exportar Simulação'
    timeout: 10000
