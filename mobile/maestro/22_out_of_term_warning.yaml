appId: com.lsimaocosta.calculadorapricesac
---
- runFlow: helpers/launch_dev_client.yaml
- tapOn:
    id: 'tab-calculator'
- scrollUntilVisible:
    element:
      id: 'btn-seed-out-of-term-warning-dev'
    direction: UP
    centerElement: true
    timeout: 12000
    speed: 50
    visibilityPercentage: 10
- tapOn:
    id: 'btn-seed-out-of-term-warning-dev'
- scrollUntilVisible:
    element:
      id: 'validation-warnings'
    centerElement: false
    timeout: 30000
    speed: 60
    visibilityPercentage: 10
- assertVisible:
    id: 'validation-warnings'
- assertVisible: 'Amortização em 03/2026 está fora do período do financiamento e foi ignorada.'
