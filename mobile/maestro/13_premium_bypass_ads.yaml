appId: com.lsimaocosta.calculadorapricesac
---
- runFlow: helpers/launch_dev_client.yaml
- tapOn:
    id: 'tab-premium'
- extendedWaitUntil:
    visible:
      id: 'screen-premium'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'btn-dev-prepare-free-rewarded'
    timeout: 8000
    speed: 80
    visibilityPercentage: 10
- tapOn:
    id: 'btn-dev-prepare-free-rewarded'
- tapOn:
    id: 'tab-calculator'
- assertVisible:
    id: 'ad-banner-stub'
- tapOn:
    id: 'tab-premium'
- scrollUntilVisible:
    element:
      id: 'btn-dev-prepare-premium'
    timeout: 8000
    speed: 60
    visibilityPercentage: 10
- tapOn:
    id: 'btn-dev-prepare-premium'
- assertNotVisible:
    id: 'ad-banner-stub'
- tapOn:
    id: 'tab-calculator'
- tapOn:
    id: 'tab-export'
- assertVisible:
    id: 'android-export-modal-card'
- assertVisible:
    id: 'android-export-modal-description'
- tapOn:
    id: 'android-export-modal-pdf'
- assertNotVisible:
    id: 'stub-ad-card-rewarded'
- extendedWaitUntil:
    notVisible:
      id: 'android-export-modal-card'
    timeout: 10000
